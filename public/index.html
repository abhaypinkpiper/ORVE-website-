<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#C9A84C" />
    <meta name="description" content="ORVÉ Luxury Jewellery — Elegance You Wear. Exquisite anti-tarnish fashion jewellery crafted for the modern woman." />
    <meta name="keywords" content="luxury jewellery, gold jewellery, ORVÉ, fashion jewellery, necklaces, rings, earrings, bracelets" />
    <title>ORVÉ — Luxury Jewellery | Elegance You Wear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Raleway:wght@200;300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { 
        background: #F5EFE0; 
        font-family: 'Raleway', sans-serif;
        cursor: none;
        overflow-x: hidden;
      }
      #custom-cursor {
        width: 20px; height: 20px;
        border: 1.5px solid #C9A84C;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 99999;
        transition: transform 0.15s ease, opacity 0.3s;
        transform: translate(-50%, -50%);
      }
      #custom-cursor-dot {
        width: 5px; height: 5px;
        background: #C9A84C;
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 99999;
        transform: translate(-50%, -50%);
        transition: transform 0.05s ease;
      }
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: #F5EFE0; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(#C9A84C, #A07830); border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="custom-cursor"></div>
    <div id="custom-cursor-dot"></div>
    <div id="root"></div>
    <script>
      const cursor = document.getElementById('custom-cursor');
      const dot = document.getElementById('custom-cursor-dot');
      document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        dot.style.left = e.clientX + 'px';
        dot.style.top = e.clientY + 'px';
      });
      document.addEventListener('mousedown', () => cursor.style.transform = 'translate(-50%,-50%) scale(0.7)');
      document.addEventListener('mouseup', () => cursor.style.transform = 'translate(-50%,-50%) scale(1)');
    </script>
  </body>
</html>
